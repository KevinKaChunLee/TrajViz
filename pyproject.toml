[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-trajviz"
version = "1.0.0"
description = "Offline analytics & visualization for LLM agent trajectories (Claude Code, Cursor, OpenCode, CodeArts, ICode, Codex CLI, Pi, DeepSeek Harness)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Rui Shu" }]
keywords = ["llm", "agent", "trajectory", "visualization", "analytics", "gradio", "plotly"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
# The core (loading, parsing, metrics, context usage, patterns, comparison and
# the collection tools) uses only the standard library; features that need
# third-party packages are extras.
dependencies = []

[project.optional-dependencies]
# Figures and the static HTML report.
charts = ["plotly>=5.0", "pygments>=2.0"]
# LLM features: the AI analysis sidebar, the Issues judge and the step labeler.
llm = ["requests>=2.0"]
# The Insight and Converge dashboards, with charts and LLM features.
app = ["agent-trajviz[charts,llm]", "gradio>=6.14.0"]
# Everything a user can install.
all = ["agent-trajviz[app]"]
# Development: the full feature set plus the test and lint tools. CI installs it
# with `uv sync --locked --extra dev`, so an undeclared test import is a
# collection error there, not a skip.
dev = [
    "agent-trajviz[all]",
    "pytest>=7.0",
    "ruff>=0.16",
    "hypothesis>=6.0",
]
# DECAF (the Attribution tab) is not on PyPI, so it has no extra: clone it and
# set AWE_DECAF_PATH (default: a sibling ../DECAF checkout).

[project.scripts]
agent-trajviz = "agent_trajviz.insight.__main__:main"
# cli.py already advertises prog="trajectory-converge" in its --help/usage text;
# without this entry that name existed nowhere and the CLI was reachable only as
# `python -m agent_trajviz.converge.cli` (C8). `python -m agent_trajviz.converge` launches
# the Gradio app and must keep doing so.
trajectory-converge = "agent_trajviz.converge.cli:main"
agent-trajviz-collect = "agent_trajviz.collect.__main__:main"
agent-trajviz-label = "agent_trajviz.labeling.step_labeler_v2:main"

[project.urls]
Homepage = "https://github.com/rshu/TrajectoryVisualizer"
Repository = "https://github.com/rshu/TrajectoryVisualizer"
Issues = "https://github.com/rshu/TrajectoryVisualizer/issues"

[tool.hatch.build.targets.wheel]
packages = ["agent_trajviz"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = [
    # Long lines inside HTML/CSS/JS template strings dominate the UI modules;
    # E501 stays advisory there. Code lines are kept within 120 by review.
    "E501",
    # Nested if/with collapses and ternary rewrites often hurt readability in
    # the step-normalization code; applied case-by-case instead of enforced.
    "SIM102", "SIM105", "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

# The presence of this table is load-bearing, independent of its contents: it
# makes THIS file pytest's inifile, which pins rootdir to this repository. A
# checkout nested inside another project whose pyproject.toml carries
# [tool.pytest.ini_options] would otherwise have pytest walk up, resolve rootdir
# to that parent and inherit its settings (unknown plugin options become
# warnings, and a bare `pytest` collects the parent's `testpaths` instead of
# ours).
#
# `pythonpath` puts the repository root on sys.path, so the suite imports the
# package from this checkout whether or not it is installed, from any CWD.
# No `addopts`: it would change CI log shape for no gain.
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
